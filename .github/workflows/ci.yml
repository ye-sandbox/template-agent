name: CI & Template Validation

on:
  push:
    branches: [ main, greenfield, brownfield, blackbox, infra, baremetal ]
  pull_request:
    branches: [ main, greenfield, brownfield, blackbox, infra, baremetal ]
  workflow_dispatch:

jobs:
  test-installers:
    name: Test Greenfield, Brownfield, Blackbox, Infra & Baremetal Starters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git author for tests
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          for branch in greenfield brownfield blackbox infra baremetal; do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || true
          done

      - name: Verify Git Whitespace Hygiene
        run: |
          git diff --check

      - name: Audit Inter-Branch Governance & Drift
        run: |
          chmod +x .github/scripts/check-branch-drift.sh
          .github/scripts/check-branch-drift.sh

      - name: Verify Micro-Contracts and Worktree Isolation Guardrails
        run: |
          chmod +x .github/scripts/verify-microcontract.sh
          .github/scripts/verify-microcontract.sh

      - name: Audit Command Security & Blast-Radius Guardrails
        run: |
          chmod +x .github/scripts/audit-command-security.sh
          .github/scripts/audit-command-security.sh

      - name: Verify Worktree Fast-Link Bootstrap & Project Lifecycle Hooks
        run: |
          chmod +x .github/scripts/bootstrap-worktree.sh
          .github/scripts/bootstrap-worktree.sh --self-test

      - name: Run Unified Starter Test Suite
        run: |
          chmod +x .github/scripts/test-all-starters.sh
          .github/scripts/test-all-starters.sh
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "### 🚀 Starter Validation Suite Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "All 5 starters (greenfield, brownfield, blackbox, infra, baremetal) passed scaffolding, drift, and E2E smoke tests on \`${{ matrix.os }}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  lint-markdown:
    name: Validate Markdown Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Markdown file syntax and non-empty content
        run: |
          echo "=== Validating Markdown files in repository ==="
          ERRORS=0
          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "❌ Empty markdown file found: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)

          if [ $ERRORS -gt 0 ]; then
            echo "Validation failed with $ERRORS empty markdown file(s)."
            exit 1
          fi
          echo "✅ All Markdown files verified successfully!"
