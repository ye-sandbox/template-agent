name: CI & Template Validation

on:
  push:
    branches: [ main, greenfield, brownfield, blackbox, infra ]
  pull_request:
    branches: [ main, greenfield, brownfield, blackbox, infra ]
  workflow_dispatch:

jobs:
  test-installers:
    name: Test Greenfield, Brownfield, Blackbox & Infra Starters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git author for tests
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          chmod +x .github/scripts/assert-starter-contracts.sh

      - name: Test Greenfield init.sh (Project Scaffolding)
        run: |
          echo "=== Testing Greenfield init.sh ==="
          git show origin/greenfield:init.sh > init.sh 2>/dev/null || git show greenfield:init.sh > init.sh
          chmod +x init.sh
          TEMPLATE_REPO_URL="$GITHUB_WORKSPACE" ./init.sh -y /tmp/ci-test-greenfield
          rm -f init.sh
          .github/scripts/assert-starter-contracts.sh greenfield /tmp/ci-test-greenfield

      - name: Test Brownfield install.sh (Legacy Injection & Idempotency)
        run: |
          echo "=== Testing Brownfield install.sh ==="
          rm -rf /tmp/brownfield-source /tmp/ci-test-brownfield
          mkdir -p /tmp/brownfield-source /tmp/ci-test-brownfield
          git archive origin/brownfield 2>/dev/null | tar -x -C /tmp/brownfield-source || git archive brownfield | tar -x -C /tmp/brownfield-source
          chmod +x /tmp/brownfield-source/install.sh
          /tmp/brownfield-source/install.sh -y /tmp/ci-test-brownfield
          /tmp/brownfield-source/install.sh -y /tmp/ci-test-brownfield
          .github/scripts/assert-starter-contracts.sh brownfield /tmp/ci-test-brownfield
          rm -rf /tmp/brownfield-source /tmp/ci-test-brownfield

      - name: Test Blackbox init.sh (Reverse Engineering Scaffolding)
        run: |
          echo "=== Testing Blackbox init.sh ==="
          git show origin/blackbox:init.sh > init-bb.sh 2>/dev/null || git show blackbox:init.sh > init-bb.sh
          chmod +x init-bb.sh
          TEMPLATE_REPO_URL="$GITHUB_WORKSPACE" ./init-bb.sh -y /tmp/ci-test-blackbox
          rm -f init-bb.sh
          .github/scripts/assert-starter-contracts.sh blackbox /tmp/ci-test-blackbox

      - name: Test Infra init.sh (Service & Homelab Scaffolding)
        run: |
          echo "=== Testing Infra init.sh ==="
          git show origin/infra:init.sh > init-infra.sh 2>/dev/null || git show infra:init.sh > init-infra.sh
          chmod +x init-infra.sh
          TEMPLATE_REPO_URL="$GITHUB_WORKSPACE" ./init-infra.sh -y /tmp/ci-test-infra
          rm -f init-infra.sh
          .github/scripts/assert-starter-contracts.sh infra /tmp/ci-test-infra

  lint-markdown:
    name: Validate Markdown Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Markdown file syntax and non-empty content
        run: |
          echo "=== Validating Markdown files in repository ==="
          ERRORS=0
          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "❌ Empty markdown file found: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)

          if [ $ERRORS -gt 0 ]; then
            echo "Validation failed with $ERRORS empty markdown file(s)."
            exit 1
          fi
          echo "✅ All Markdown files verified successfully!"
